# 사내 규정 온톨로지.
#   aliases = 사람들이 질문에 쓰는 말   /  terms = 문서가 실제로 쓰는 말(3글자 이상, 검색 확장에 쓰임)
#   parent  = is_a 관계                /  governed_by = 이 개념을 규율하는 문서 (없으면 부모에서 상속)
# 문서에는 접근 등급(level)과 담당 팀(owner)이 붙고, 역할(role)은 볼 수 있는 등급을 가진다.
# 여기 없는 문서는 가장 엄격한 등급(restricted)으로 취급한다 (fail-closed).

[roles.guest]
label = "외부인"
levels = ["public"]

[roles.employee]
label = "일반 직원"
levels = ["public", "internal"]

[roles.hr]
label = "인사팀"
levels = ["public", "internal", "restricted"]

[documents."vacation.md"]
level = "internal"
owner = "인사팀"

[documents."onboarding.md"]
level = "internal"
owner = "인사팀"

[documents."expense.md"]
level = "internal"
owner = "재무팀"

[documents."security.md"]
level = "internal"
owner = "보안팀"

[documents."payroll.md"]
level = "restricted"
owner = "인사팀"

